<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>URL Guardian</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>

/* Gradient Background */
body{
background: linear-gradient(135deg,#0a3087,#8a1e4b,#2d7232);
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
font-family:'Segoe UI',sans-serif;
}

/* Card animation */
.card{
animation:fadeIn 1s ease-in-out;
}

/* Slideshow */
.slideshow{
position:relative;
height:200px;
overflow:hidden;
border-radius:12px;
margin-bottom:20px;
}

.slide{
position:absolute;
width:100%;
height:100%;
object-fit:cover;
opacity:0;
transition:opacity 1s;
}

.slide.active{
opacity:1;
}

/* Input styling */
input{
transition:all 0.3s ease;
}

input:focus{
outline:none;
border:2px solid #a7492f;
box-shadow:0 0 10px #ba7124;
}

/* Button animation */
.scan-btn{
background:linear-gradient(90deg,#2563eb,#1d4ed8);
transition:0.4s;
}

.scan-btn:hover{
transform:scale(1.05);
background:linear-gradient(90deg,#1d4ed8,#1e40af);
box-shadow:0 0 15px rgba(59,130,246,0.7);
}

/* Loading animation */
.loading{
animation:pulse 1s infinite;
}

#result{
animation:slideUp 0.6s ease;
}

/* Animations */

@keyframes fadeIn{
from{opacity:0; transform:translateY(20px);}
to{opacity:1; transform:translateY(0);}
}

@keyframes slideUp{
from{opacity:0; transform:translateY(30px);}
to{opacity:1; transform:translateY(0);}
}

@keyframes pulse{
0%{opacity:0.5;}
50%{opacity:1;}
100%{opacity:0.5;}
}

</style>
</head>

<body>

<div class="card max-w-2xl w-full p-8 bg-white rounded-2xl shadow-2xl">

<h1 class="text-3xl font-bold text-center text-blue-700 mb-2">
🔐 URL Guardian
</h1>

<p class="text-center text-gray-600 mb-4">
Malicious URL Detection System
</p>

<!-- Slideshow -->

<div class="slideshow">

<img src="https://images.unsplash.com/photo-1550751827-4bd374c3f58b" alt="Cybersecurity lock concept" class="slide active">
<img src="https://images.unsplash.com/photo-1563986768609-322da13575f3" alt="Digital security network" class="slide">
<img src="https://images.unsplash.com/photo-1518779578993-ec3579fee39f" alt="Computer circuit board security" class="slide">
<img src="https://images.unsplash.com/photo-1558494949-ef010cbdcc31" alt="Data protection technology" class="slide">
</div>

<input id="urlInput"
type="text"
placeholder="Enter URL here"
class="w-full p-3 border rounded-lg mb-4"/>

<button onclick="checkURL()"
class="scan-btn w-full text-white p-3 rounded-lg font-semibold">
Scan URL
</button>

<div id="result" class="mt-6 hidden p-4 rounded-lg text-center"></div>

</div>

<script>

/* Slideshow Script */

let slideIndex=0;
const slides=document.querySelectorAll(".slide");

function showSlides(){

slides.forEach(slide=>slide.classList.remove("active"));

slideIndex++;

if(slideIndex>=slides.length){
slideIndex=0;
}

slides[slideIndex].classList.add("active");

}

setInterval(showSlides,3000);

/* URL Check */

async function checkURL(){

const url=document.getElementById('urlInput').value;
const resultBox=document.getElementById('result');

if(!url){
alert('Please enter a URL');
return;
}

resultBox.className='mt-6 p-4 rounded-lg bg-yellow-100 loading';
resultBox.innerHTML='🔍 Scanning URL...';
resultBox.classList.remove('hidden');

try{

const response = await fetch('http://127.0.0.1:5000/scan', {
method:'POST',
headers:{'Content-Type':'application/json'},
body:JSON.stringify({url:url})
});

const data=await response.json();

if(data.status==='malicious'){
resultBox.className='mt-6 p-4 rounded-lg bg-red-100 border border-red-400';
}
else{
resultBox.className='mt-6 p-4 rounded-lg bg-green-100 border border-green-400';
}

resultBox.innerHTML=`
<h3 class='font-bold text-lg'>Result: ${data.status}</h3>
<p>Risk Score: ${data.risk_score}%</p>
<p>Type: ${data.type}</p>
<p>Reason: ${data.reason}</p>
`;

}

catch(err){

resultBox.className='mt-6 p-4 rounded-lg bg-red-100';
resultBox.innerHTML='❌ Error connecting to server';

}

}

</script>

</body>
</html>
